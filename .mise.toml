[tools]
# Linters used by `mise run lint`. pipx backend resolves through uv.
yamllint = "latest"
"pipx:ansible-lint" = "latest"

[tasks.setup]
description = "Interactive wizard to configure provisioning inventory"
run = "bash scripts/setup-wizard.sh"

[tasks.install]
description = "Install Ansible and required collections"
# -p is required. Arch's `ansible` package bundles community.general inside
# site-packages, so a bare `ansible-galaxy install` reports "already installed"
# and writes nothing -- but ansible-lint runs its own isolated ansible-core
# that cannot see site-packages, and fails with syntax-check[unknown-module].
# --force is required too: without it galaxy still finds the site-packages copy
# and reports "Nothing to do", leaving ~/.ansible/collections empty.
run = "ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections --force"

[tasks.lint]
description = "Run yamllint and ansible-lint"
run = """
# Both always run; a yamllint failure must not hide the ansible-lint report.
rc=0
echo "Running yamllint..."
yamllint . || rc=1
echo ""
echo "Running ansible-lint..."
ansible-lint || rc=1
exit $rc
"""

[tasks.syntax]
description = "Check playbook syntax"
run = """
ansible-playbook --syntax-check playbooks/install-arch.yml
ansible-playbook --syntax-check site.yml
"""

[tasks.test]
description = "Run all quality checks"
depends = ["syntax", "lint"]

[tasks.ping]
description = "Test connectivity to provision hosts"
run = "ansible -i inventories/provision/hosts.ini all -m ansible.builtin.ping"

[tasks.check]
description = "Run provisioning in check mode (dry run)"
run = "ansible-playbook -i inventories/provision/hosts.ini site.yml --check"

[tasks.provision]
description = "Run post-install provisioning"
run = "ansible-playbook -i inventories/provision/hosts.ini site.yml"

[tasks.install-arch]
description = "Run Arch installation (DESTRUCTIVE)"
run = """
echo "WARNING: This will partition and format the target disk!"
echo "Press Ctrl+C within 5 seconds to abort..."
sleep 5
ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i inventories/install/hosts.ini playbooks/install-arch.yml --ask-pass
"""

[tasks.clean]
description = "Clean temporary files and caches"
run = """
find . -name "*.retry" -delete
rm -rf .cache/
rm -rf ~/.ansible/facts_cache/*
echo "Clean complete!"
"""

[tasks.wifi]
description = "Connect to WiFi network"
run = """
read -p "SSID: " ssid
read -sp "Password: " pass
echo ""
nmcli device wifi connect "$ssid" password "$pass"
"""
