---
# Post-installation provisioning
# Run this after the system has been installed and rebooted
- name: Post-install provisioning
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: true

  pre_tasks:
    - name: Ensure pacman cache is up to date
      community.general.pacman:
        update_cache: true
      tags:
        - always

  roles:
    - role: common
      tags:
        - common
        - baseline
    - role: wayland
      tags:
        - wayland
    - role: esp32
      tags:
        - esp32
    - role: gaming
      tags:
        - gaming
    - role: llama_cpp
      tags:
        - llama_cpp
    - role: kodi
      tags:
        - kodi

  post_tasks:
    - name: Provisioning complete
      ansible.builtin.debug:
        msg: "Post-installation provisioning completed successfully!"
      tags:
        - always
