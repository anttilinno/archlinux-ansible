---
# llama.cpp role tasks

- name: Install llama.cpp (CPU build)
  ansible.builtin.command: yay -S --noconfirm --needed {{ llama_cpp_packages | join(' ') }}
  register: llama_cpp_result
  changed_when: "'installing' in llama_cpp_result.stdout"
  when: llama_cpp_enabled | bool and not llama_cpp_cuda_enabled | bool
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  tags: [packages, aur, llama-cpp]

- name: Install llama.cpp (CUDA build)
  ansible.builtin.command: yay -S --noconfirm --needed {{ llama_cpp_cuda_packages | join(' ') }}
  register: llama_cpp_cuda_result
  changed_when: "'installing' in llama_cpp_cuda_result.stdout"
  when: llama_cpp_cuda_enabled | bool
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  tags: [packages, aur, llama-cpp, llama-cpp-cuda]
