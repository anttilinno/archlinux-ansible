---
# ollama role tasks

- name: Install ollama (CPU build)
  community.general.pacman:
    name: ollama
    state: present
  when: ollama_enabled | bool and not ollama_cuda_enabled | bool
  tags: [packages, ollama]

- name: Install ollama (CUDA build)
  ansible.builtin.command: yay -S --noconfirm --needed {{ ollama_cuda_packages | join(' ') }}
  register: ollama_cuda_result
  changed_when: "'installing' in ollama_cuda_result.stdout"
  when: ollama_cuda_enabled | bool
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  tags: [packages, aur, ollama, ollama-cuda]

- name: Enable and start ollama service
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started
  when: ollama_enabled | bool or ollama_cuda_enabled | bool
  tags: [services, ollama]
