---
# Wayland role tasks

- name: Install niri compositor
  community.general.pacman:
    name: "{{ wayland_niri_packages }}"
    state: present
  when: wayland_niri_enabled | bool
  tags: [packages, niri]

- name: Install wayland bar
  community.general.pacman:
    name: "{{ wayland_bar_packages }}"
    state: present
  when: wayland_bar_enabled | bool
  tags: [packages, bar]

- name: Install wayland utilities
  community.general.pacman:
    name: "{{ wayland_utils_packages }}"
    state: present
  when: wayland_utils_enabled | bool
  tags: [packages, wayland-utils]

- name: Install zathura PDF viewer
  community.general.pacman:
    name: "{{ wayland_zathura_packages }}"
    state: present
  when: wayland_zathura_enabled | bool
  tags: [packages, zathura]

- name: Install Dank Material Shell dependencies
  community.general.pacman:
    name: "{{ wayland_dms_packages }}"
    state: present
  when: wayland_dms_enabled | bool
  tags: [packages, dms]

- name: Install Dank Material Shell AUR packages
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  ansible.builtin.command: yay -S --noconfirm --needed {{ wayland_dms_aur_packages | join(' ') }}
  when: wayland_dms_enabled | bool and wayland_dms_aur_packages | length > 0
  tags: [packages, dms, aur]

- name: Create getty@tty1 override directory
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"
  when: wayland_autologin_enabled | bool
  tags: [wayland, autologin]

- name: Configure autologin on tty1
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/usr/bin/agetty --autologin {{ wayland_autologin_user }} --noclear %I $TERM
    mode: "0644"
  when: wayland_autologin_enabled | bool
  tags: [wayland, autologin]

- name: Configure auto-start niri on login for tty1
  ansible.builtin.blockinfile:
    path: "/home/{{ wayland_autologin_user }}/.bash_profile"
    create: true
    owner: "{{ wayland_autologin_user }}"
    group: "{{ wayland_autologin_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - autostart niri"
    block: |
      if [ -z "$WAYLAND_DISPLAY" ] && [ "$XDG_VTNR" = 1 ]; then
        exec niri-session
      fi
  when: wayland_autologin_enabled | bool
  tags: [wayland, autologin]

- name: Get target user info for Slack Wayland flags
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  when: common_office_enabled | default(false) | bool
  tags: [slack]

- name: Configure Slack to run natively on Wayland
  ansible.builtin.copy:
    dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/.config/slack-flags.conf"
    content: |
      --enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer
      --ozone-platform=wayland
    owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    mode: "0644"
  when: common_office_enabled | default(false) | bool
  tags: [slack]
