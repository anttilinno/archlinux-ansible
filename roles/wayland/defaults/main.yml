---
# Wayland compositor and utilities

# Niri compositor
wayland_niri_enabled: true
wayland_niri_packages:
  - niri
  - xorg-xwayland
  - xwayland-satellite
  - xdg-desktop-portal-gnome

# Wayland bar
wayland_bar_enabled: true
wayland_bar_packages:
  - waybar

# Wayland utilities
wayland_utils_enabled: true
wayland_utils_packages:
  - fuzzel
  - foot
  - grim
  - slurp
  - satty
  - wl-clipboard
  - wpaperd
  - swaylock

# Documents and drawing.
#   zathura   - keyboard-driven PDF viewer (poppler backend), read-only
#   xournalpp - PDF annotation and handwritten notes, pressure-aware
#   krita     - digital painting; the heavy one, ~200 MB installed
# Krita is why retro_laptops.yml.example turns this group off.
#
# Poppler rather than mupdf as the zathura backend: zathura-pdf-mupdf pulls
# libmupdf -> tesseract, which depends on the virtual `tessdata`. That has 128
# providers, so under --noconfirm pacman silently takes default=1 and installs
# tesseract-data-afr (Afrikaans OCR data). Poppler avoids the chain entirely,
# and xournalpp already depends on poppler-glib.
wayland_zathura_enabled: true
wayland_zathura_packages:
  - zathura
  - zathura-pdf-poppler
  - xournalpp
  - krita

# Dank Material Shell (Quickshell-based desktop shell)
# Repo: https://github.com/AvengeMedia/DankMaterialShell
wayland_dms_enabled: true
wayland_dms_packages:
  - quickshell
  - dgop
  - accountsservice
  - cava
  - i2c-tools
  - ddcutil
  - cliphist
  - libqalculate
  - power-profiles-daemon
  - qt6-multimedia
  - qt6ct
  - wtype
  # DMS was renamed Dux Shell and moved to extra; it still ships dms.service.
  # dms-shell-git is gone from the AUR, and yay exits 0 on a missing package.
  - dux-shell
  - matugen
  - ttf-material-symbols-variable
# Both used to come from the AUR as the builds below; they conflict with the
# extra packages and are removed first (nothing depends on them by name).
wayland_dms_replaced_aur_packages:
  - matugen-bin
  - ttf-material-symbols-variable-git
wayland_dms_aur_packages: []

# Keys merged into DMS's session state (~/.local/state/dms/session.json), which
# holds what settings.json doesn't: wallpaper, weather location. DMS watches the
# file, so a running shell picks changes up. Example:
#   wallpaperPath: /home/me/Pictures/wall.png
#   weatherLocation: Tallinn, Estonia
#   weatherCoordinates: "59.4370,24.7536"   # also set useAutoLocation false in settings.json
wayland_dms_session: {}
wayland_dms_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

# Autologin and start niri on tty1
wayland_autologin_enabled: false
wayland_autologin_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
# false = autologin to a console shell; niri is started by hand
wayland_autologin_niri: true
