---
# Wayland compositor and utilities

# Niri compositor
wayland_niri_enabled: true
wayland_niri_packages:
  - niri
  - xorg-xwayland
  - xwayland-satellite
  - xdg-desktop-portal-gnome

# Wayland bar
wayland_bar_enabled: true
wayland_bar_packages:
  - waybar

# Wayland utilities
wayland_utils_enabled: true
wayland_utils_packages:
  - fuzzel
  - foot
  - grim
  - slurp
  - satty
  - wl-clipboard
  - wpaperd
  - swaylock

# Documents and drawing.
#   zathura   - keyboard-driven PDF viewer (poppler backend), read-only
#   xournalpp - PDF annotation and handwritten notes, pressure-aware
#   krita     - digital painting; the heavy one, ~200 MB installed
# Krita is why retro_laptops.yml.example turns this group off.
#
# Poppler rather than mupdf as the zathura backend: zathura-pdf-mupdf pulls
# libmupdf -> tesseract, which depends on the virtual `tessdata`. That has 128
# providers, so under --noconfirm pacman silently takes default=1 and installs
# tesseract-data-afr (Afrikaans OCR data). Poppler avoids the chain entirely,
# and xournalpp already depends on poppler-glib.
wayland_zathura_enabled: true
wayland_zathura_packages:
  - zathura
  - zathura-pdf-poppler
  - xournalpp
  - krita

# Dank Material Shell (Quickshell-based desktop shell)
# Repo: https://github.com/AvengeMedia/DankMaterialShell
wayland_dms_enabled: true
wayland_dms_packages:
  - quickshell
  - dgop
  - accountsservice
  - cava
  - i2c-tools
  - ddcutil
  - cliphist
  - libqalculate
  - power-profiles-daemon
  - qt6-multimedia
  - qt6ct
  - wtype
wayland_dms_aur_packages:
  - dms-shell-git
  - matugen-bin
  - ttf-material-symbols-variable-git

# Autologin and start niri on tty1
wayland_autologin_enabled: false
wayland_autologin_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
