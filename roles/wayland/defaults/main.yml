---
# Wayland compositor and utilities

# Niri compositor
wayland_niri_enabled: true
wayland_niri_packages:
  - niri
  - xorg-xwayland
  - xdg-desktop-portal-gnome

# Wayland bar
wayland_bar_enabled: true
wayland_bar_packages:
  - waybar

# Wayland utilities
wayland_utils_enabled: true
wayland_utils_packages:
  - fuzzel
  - foot
  - grim
  - slurp
  - satty
  - wl-clipboard
  - wpaperd

# Dank Material Shell (Quickshell-based desktop shell)
# Repo: https://github.com/AvengeMedia/DankMaterialShell
wayland_dms_enabled: false
wayland_dms_packages:
  - quickshell
  - dgop
  - accountsservice
  - cava
  - i2c-tools
  - ddcutil
  - cliphist
  - libqalculate
  - power-profiles-daemon
  - qt6-multimedia
  - qt6ct
  - wtype
wayland_dms_aur_packages:
  - dms-shell-git
  - matugen-bin
  - ttf-material-symbols-variable-git

# Autologin and start niri on tty1
wayland_autologin_enabled: false
wayland_autologin_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
