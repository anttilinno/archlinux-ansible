---
- name: Check that pacstrap is available on ISO
  ansible.builtin.command: which pacstrap
  changed_when: false
  check_mode: false

- name: Check if target already has base system
  ansible.builtin.stat:
    path: /mnt/etc/arch-release
  register: arch_install_already_installed
  check_mode: false

- name: Display installation status
  ansible.builtin.debug:
    msg: >-
      {% if arch_install_already_installed.stat.exists %}
      Arch Linux is already installed. Use arch_install_force_repartition=true to reinstall.
      {% else %}
      No existing installation detected. Proceeding with fresh install.
      {% endif %}

- name: LUKS passphrase prompt block
  when:
    - arch_install_encrypt | bool
    - arch_install_luks_passphrase is not defined
  block:
    - name: Prompt for LUKS passphrase
      ansible.builtin.pause:
        prompt: "LUKS passphrase for the root partition"
        echo: false
      register: arch_install_luks_prompt1

    - name: Confirm LUKS passphrase
      ansible.builtin.pause:
        prompt: "Repeat LUKS passphrase"
        echo: false
      register: arch_install_luks_prompt2

    # A typo here leaves an unbootable, unrecoverable disk
    - name: Check LUKS passphrases match
      ansible.builtin.assert:
        that:
          - arch_install_luks_prompt1.user_input == arch_install_luks_prompt2.user_input
          - arch_install_luks_prompt1.user_input | length >= 8
        fail_msg: "Passphrases differ or are shorter than 8 characters"
        quiet: true
      no_log: true

    - name: Set LUKS passphrase fact
      ansible.builtin.set_fact:
        arch_install_luks_passphrase: "{{ arch_install_luks_prompt1.user_input }}"
      no_log: true
