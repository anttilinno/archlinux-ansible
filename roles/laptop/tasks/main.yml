---
# laptop role tasks

# laptop_battery may be one name (BAT0) or a list ([BAT0, BAT1])
- name: Persist battery charge limit (applied at boot via tmpfiles)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/battery-charge-threshold.conf
    content: |
      {% for bat in [laptop_battery] | flatten %}
      w /sys/class/power_supply/{{ bat }}/charge_control_end_threshold - - - - {{ laptop_battery_charge_limit }}
      {% endfor %}
    mode: "0644"
  when: laptop_battery_charge_limit_enabled | bool
  tags: [laptop, battery]

- name: Apply battery charge limit now
  ansible.builtin.shell: >-
    echo {{ laptop_battery_charge_limit }}
    > /sys/class/power_supply/{{ item }}/charge_control_end_threshold
  loop: "{{ [laptop_battery] | flatten }}"
  changed_when: true
  when: laptop_battery_charge_limit_enabled | bool
  tags: [laptop, battery]

- name: Blacklist nouveau and nvidia modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nvidia.conf
    content: |
      blacklist nouveau
      blacklist nvidia
      blacklist nvidia_drm
      blacklist nvidia_modeset
      blacklist nvidia_uvm
    mode: "0644"
  register: laptop_nvidia_blacklist
  when: laptop_nvidia_blacklist_enabled | bool
  tags: [laptop, nvidia]

# The kms hook pulls nouveau into the initramfs; mkinitcpio copies
# modprobe.d in, so a rebuild makes the blacklist apply at early boot too.
- name: Rebuild initramfs with the blacklist
  ansible.builtin.command: mkinitcpio -P
  changed_when: true
  when:
    - laptop_nvidia_blacklist_enabled | bool
    - laptop_nvidia_blacklist is changed
  tags: [laptop, nvidia]

# With no driver bound, the PCI core only suspends the card when
# power/control is auto; the default "on" keeps it drawing power.
- name: Let the driverless NVIDIA GPU runtime-suspend
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-nvidia-pm.rules
    content: >
      ACTION=="add|bind", SUBSYSTEM=="pci", ATTR{vendor}=="0x10de",
      ATTR{class}=="0x03[0-9]*", TEST=="power/control", ATTR{power/control}="auto"
    mode: "0644"
  when: laptop_nvidia_blacklist_enabled | bool
  tags: [laptop, nvidia]
