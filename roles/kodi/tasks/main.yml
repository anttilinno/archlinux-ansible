---
# Kodi role tasks
# Depends on i3 (Xorg) being enabled

- name: Verify i3 dependency
  ansible.builtin.assert:
    that: common_i3_enabled | bool
    fail_msg: "Kodi role requires i3 (common_i3_enabled: true)"
  when: kodi_enabled | bool
  tags: [kodi]

- name: Install Kodi
  community.general.pacman:
    name: "{{ kodi_packages }}"
    state: present
  when: kodi_enabled | bool
  tags: [packages, kodi]

- name: Install media player and codecs
  community.general.pacman:
    name: "{{ kodi_media_packages }}"
    state: present
  when: kodi_enabled | bool and kodi_media_enabled | bool
  tags: [packages, kodi, media]

- name: Install Kodi addons
  community.general.pacman:
    name: "{{ kodi_addon_packages }}"
    state: present
  when: kodi_enabled | bool and kodi_addons_enabled | bool
  tags: [packages, kodi, kodi-addons]
