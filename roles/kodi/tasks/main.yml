---
# Kodi role tasks
# Depends on i3 (Xorg) being enabled

- name: Verify i3 dependency
  ansible.builtin.assert:
    that: common_i3_enabled | bool
    fail_msg: "Kodi role requires i3 (common_i3_enabled: true)"
  when: kodi_enabled | bool
  tags: [kodi]

- name: Install Kodi
  community.general.pacman:
    name: "{{ kodi_packages }}"
    state: present
  when: kodi_enabled | bool
  tags: [packages, kodi]

- name: Install media player and codecs
  community.general.pacman:
    name: "{{ kodi_media_packages }}"
    state: present
  when: kodi_enabled | bool and kodi_media_enabled | bool
  tags: [packages, kodi, media]

- name: Install Kodi addons
  community.general.pacman:
    name: "{{ kodi_addon_packages }}"
    state: present
  when: kodi_enabled | bool and kodi_addons_enabled | bool
  tags: [packages, kodi, kodi-addons]

- name: Install Kodi AUR packages
  become: true
  become_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
  ansible.builtin.command: yay -S --noconfirm --needed {{ kodi_aur_packages | join(' ') }}
  when: kodi_enabled | bool and kodi_aur_enabled | bool
  tags: [packages, kodi, aur]

- name: Create getty@tty1 override directory
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"
  when: kodi_enabled | bool and kodi_autologin_enabled | bool
  tags: [kodi, autologin]

- name: Configure autologin on tty1
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/usr/bin/agetty --autologin {{ kodi_autologin_user }} --noclear %I $TERM
    mode: "0644"
  when: kodi_enabled | bool and kodi_autologin_enabled | bool
  tags: [kodi, autologin]

- name: Configure .xinitrc to start i3
  ansible.builtin.copy:
    dest: "/home/{{ kodi_autologin_user }}/.xinitrc"
    content: "exec i3\n"
    owner: "{{ kodi_autologin_user }}"
    group: "{{ kodi_autologin_user }}"
    mode: "0644"
  when: kodi_enabled | bool and kodi_autologin_enabled | bool
  tags: [kodi, autologin]

- name: Configure auto startx on login for tty1
  ansible.builtin.blockinfile:
    path: "/home/{{ kodi_autologin_user }}/.bash_profile"
    create: true
    owner: "{{ kodi_autologin_user }}"
    group: "{{ kodi_autologin_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - autostart i3"
    block: |
      if [ -z "$DISPLAY" ] && [ "$XDG_VTNR" = 1 ]; then
        exec startx
      fi
  when: kodi_enabled | bool and kodi_autologin_enabled | bool
  tags: [kodi, autologin]

- name: Install automount packages
  community.general.pacman:
    name: "{{ kodi_automount_packages }}"
    state: present
  when: kodi_enabled | bool and kodi_automount_enabled | bool
  tags: [packages, kodi, automount]

- name: Enable udisks2 service
  ansible.builtin.systemd:
    name: udisks2.service
    enabled: true
    state: started
  when: kodi_enabled | bool and kodi_automount_enabled | bool
  tags: [kodi, automount]

- name: Configure udiskie autostart in i3
  ansible.builtin.blockinfile:
    path: "/home/{{ kodi_autologin_user }}/.xinitrc"
    insertbefore: "exec i3"
    marker: "# {mark} ANSIBLE MANAGED - udiskie automount"
    block: |
      udiskie --no-notify --tray &
  when: kodi_enabled | bool and kodi_automount_enabled | bool and kodi_autologin_enabled | bool
  tags: [kodi, automount]

- name: Disable X11 screen blanking and DPMS (leave only Kodi screensaver)
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/10-no-blanking.conf
    content: |
      Section "ServerFlags"
          Option "BlankTime"  "0"
          Option "StandbyTime" "0"
          Option "SuspendTime" "0"
          Option "OffTime"    "0"
      EndSection

      Section "ServerLayout"
          Identifier "DefaultLayout"
          Option "DPMS" "false"
      EndSection
    mode: "0644"
  when: kodi_enabled | bool
  tags: [kodi]
